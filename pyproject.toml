[tool.poetry]
name = "nilmtk"
version = "0.1.0"
description = "Estimate the energy consumer by individual appliances from whole-house power meter readings"
authors = ["Emilio J. Palacios-Garcia <emiliojose.palaciosgarcia@kuleuven.be>"]
license = "\"Apache 2.0\""
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
pandas = "^3.0.3"
numpy = "^2.4.1"
networkx = "^3.1"
scipy = "^1.11.1"
tables = "^3.8.0"
scikit-learn = "^1.3.0"
PyYAML = "^6.0"
pytz = "^2026.2"
matplotlib = "^3.7.2"
nilm-metadata = {git = "https://github.com/ejpalacios/nilm_metadata.git"}


[tool.poetry.group.test.dependencies]
coverage = "^7.2.7"
pytest = "^9.0.2"
pytest-coverage = "^0.0"


[tool.poetry.group.dev.dependencies]
matplotlib = "^3.7.2"
jupyterlab = "^4.0.2"
black = "^26.1.0"
isort = "^8.0.1"
mypy = "^2.1.0"

[tool.isort]
profile = "black"
skip = ["__init__.py"]

[tool.coverage.run]
source = ["nilmtk"]

[tool.coverage.report]
omit = [ 
    "*/python?.?/*",
    "*/site-packages/nose/*",
    "*nilmtk/notebooks/*"
]

# Fix warnings for libraries without stubs
[[tool.mypy.overrides]]
ignore_missing_imports = true
module = [
    "networkx",
    "scipy.*",
    "sklearn.*",
    "matplotlib.*",
    "mpl_toolkits.*",
    "nilm_metadata.*",
    "pytz",
    "pandas.*",
    "tables.*"

]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


